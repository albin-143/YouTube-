            String _uaFor(Uri u) {
              switch (u.queryParameters['c']) {
                case 'ANDROID_VR':
                  return 'com.google.android.apps.youtube.vr.oculus/1.62.27 (Linux; U; Android 12L; eureka-user Build/SQ3A.220605.009.A1) gzip';
                case 'IOS':
                  return 'com.google.ios.youtube/20.10.4 (iPhone16,2; U; CPU iOS 18_3_2 like Mac OS X;)';
                case 'ANDROID':
                  return 'com.google.android.youtube/20.10.38 (Linux; U; Android 14) gzip';
                default:
                  return 'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36';
              }
            }

            // Veegama download: 8 connection sernthu (parallel). Oru chunk fail aanaa
            // adha mattum thirumba try pannum, restart aagaadhu. 403 vandhaa connection kuraikkum.
            Future<void> _fetchFast(
                yte.StreamInfo s, File f, String id, void Function(int) onBytes) async {
              final total = s.size.totalBytes;
              const chunk = 1024 * 1024;
              final n = (total + chunk - 1) ~/ chunk;
              final client = HttpClient()
                ..connectionTimeout = const Duration(seconds: 15)
                ..userAgent = _uaFor(s.url);
              _clients[id] = client;
              final raf = await f.open(mode: FileMode.write);
              Future<void> lock = Future.value();
              Future<void> writeAt(int pos, List<int> data) {
                final p = lock.then((_) async {
                  await raf.setPosition(pos);
                  await raf.writeFrom(data);
                });
                lock = p.catchError((_) {});
                return p;
              }

              final todo = List<int>.generate(n, (i) => i);
              final failed = <int>[];
              var workers = 8;
              var doneCount = 0;
              var hardFails = 0;
              var lastErr = '';

              Future<void> worker() async {
                while (true) {
                  if (_cancelled.contains(id)) throw 'cancelled';
                  if (todo.isEmpty) return;
                  final i = todo.removeAt(0);
                  final start = i * chunk;
                  final end =
                      (start + chunk - 1 < total) ? start + chunk - 1 : total - 1;
                  var ok = false;
                  var hard = false;
                  for (var attempt = 0; attempt < 3 && !ok && !hard; attempt++) {
                    var counted = 0;
                    try {
                      final req = await client
                          .getUrl(Uri.parse('${s.url}&range=$start-$end'))
                          .timeout(const Duration(seconds: 15));
                      final res =
                          await req.close().timeout(const Duration(seconds: 15));
                      if (res.statusCode != 206 && res.statusCode != 200) {
                        await res.drain();
                        throw 'http ${res.statusCode}';
                      }
                      if (res.contentLength != end - start + 1) {
                        await res.drain();
                        throw 'range ignored';
                      }
                      var pos = start;
                      await for (final d in res.timeout(const Duration(seconds: 12))) {
                        await writeAt(pos, d);
                        pos += d.length;
                        counted += d.length;
                        onBytes(d.length);
                      }
                      if (counted != end - start + 1) throw 'short';
                      ok = true;
                    } catch (e) {
                      onBytes(-counted);
                      if (_cancelled.contains(id)) throw 'cancelled';
                      lastErr = e.toString();
                      if (e is String && e.startsWith('http 4')) hard = true;
                    }
                  }
                  if (ok) {
                    doneCount++;
                  } else {
                    failed.add(i);
                    if (hard) hardFails++;
                    return; // indha worker nikkum, apram kuraincha connection la thodarum
                  }
                }
              }

              try {
                var stuck = 0;
                while (true) {
                  _active[id]?['mode'] = 'Fast x$workers';
                  final before = doneCount;
                  await Future.wait(List.generate(workers, (_) => worker()));
                  if (todo.isEmpty && failed.isEmpty) break;
                  todo.addAll(failed);
                  failed.clear();
                  todo.sort();
                  if (doneCount == before) {
                    if (++stuck >= 3) throw lastErr;
                  } else {
                    stuck = 0;
                  }
                  if (hardFails > 0) {
                    workers = workers > 1 ? workers ~/ 2 : 1;
                    hardFails = 0;
                  }
                  await Future.delayed(const Duration(seconds: 2));
                }
              } finally {
                await lock;
                await raf.close();
                if (_clients[id] == client) _clients.remove(id);
                client.close(force: true);
              }
            }

            Future<void> _fetch(yte.StreamInfo s, File f, String id,
                void Function(int) onBytes) async {
              var counted = 0;
              void cnt(int n) {
                counted += n;
                onBytes(n);
              }

              try {
                _active[id]?['mode'] = 'Fast mode';
                await _fetchFast(s, f, id, cnt);
                return;
              } catch (e) {
                if (_cancelled.contains(id)) rethrow;
                onBytes(-counted);
                counted = 0;
                final m = e.toString();
                _active[id]?['mode'] = 'Slow mode';
                _active[id]?['err'] = m.length > 60 ? m.substring(0, 60) : m;
              }
              final sink = f.openWrite();
              try {
                await for (final chunk in _yt.videos.streamsClient
                    .get(s)
                    .timeout(const Duration(seconds: 25))) {
                  if (_cancelled.contains(id)) throw 'cancelled';
                  sink.add(chunk);
                  onBytes(chunk.length);
                }
                await sink.flush();
              } finally {
                await sink.close();
              }
            }

            Future<void> _download(String id, String title, _Opt o) async {
              final q = o.label.split(' ').first;
              setState(() {
                _progress[id] = 0;
                _active[id] = {'title': title, 'q': q, 'merging': false};
                _cancelled.remove(id);
              });
              if (_activeCount++ == 0) _svc(true);
              try {
                await _call('askNotif');
              } catch (_) {}
              final tmp = await getTemporaryDirectory();
              final temps = <File>[];
              try {
                _msg('Download aaguthu... My Files la paarunga');
                final ext = o.webm ? 'webm' : 'mp4';
                final mime = o.webm ? 'video/webm' : 'video/mp4';
                var got = 0;
                var lastPct = -1;
                var lastN = DateTime.fromMillisecondsSinceEpoch(0);
                void tick(int n, int total) {
                  got += n;
                  _active[id]?['got'] = got;
                  final raw = got * 100 ~/ total;
                  final pct = raw < 0 ? 0 : (raw > 100 ? 100 : raw);
                  if (pct != lastPct && mounted) {
                    lastPct = pct;
                    setState(() => _progress[id] = got / total);
                  }
                  final now = DateTime.now();
                  if (now.difference(lastN).inMilliseconds > 800) {
                    lastN = now;
                    _notify(id, title, '$q  •  $pct%', pct, true);
                  }
                }

                late File out;
                if (o.hlsVideo != null) {
                  final hasA = o.hlsAudio != null;
                  var hb = 0;
                  var hLastB = 0;
                  var hPct = -1;
                  var hLastS = DateTime.now();
                  var hLastN = DateTime.fromMillisecondsSinceEpoch(0);
                  void hTick(double p) {
                    final pct = (p * 100).floor();
                    if (pct != hPct && mounted) {
                      hPct = pct;
                      setState(() => _progress[id] = p);
                    }
                    final now = DateTime.now();
                    final dt = now.difference(hLastS).inMilliseconds;
                    var sp = 0.0;
                    if (dt >= 1000) {
                      sp = (hb - hLastB) / dt / 1000;
                      hLastS = now;
                      hLastB = hb;
                      if (mounted) {
                        setState(() {
                          _active[id]?['speed'] = sp < 0 ? 0.0 : sp;
                          _active[id]?['mode'] = 'HLS';
                        });
                      }
                    }
                    if (now.difference(hLastN).inMilliseconds > 800) {
                      hLastN = now;
                      _notify(id, title, '$q  •  $pct%', pct, true);
                    }
                  }

                  final vf = File('${tmp.path}/${id}_hv');
                  final af = File('${tmp.path}/${id}_ha');
                  out = File('${tmp.path}/${id}_out.mp4');
                  temps.addAll([vf, af, out]);
                  await _hlsDownload(o.hlsVideo!, vf, id,
                      (d, t) => hTick(d / t * (hasA ? 0.85 : 1.0)), (b) => hb += b, o.hlsUa ?? _hlsUa);
                  if (hasA) {
                    await _hlsDownload(o.hlsAudio!, af, id,
                        (d, t) => hTick(0.85 + 0.15 * d / t), (b) => hb += b, o.hlsUa ?? _hlsUa);
                  }
                  if (_cancelled.contains(id)) throw 'cancelled';
                  if (mounted) {
                    setState(() {
                      _progress[id] = 0;
                      _active[id]?['merging'] = true;
                    });
                  }
                  _notify(id, title, 'Merge aaguthu...', -1, true);
                  await _call('mux', {
                    'video': vf.path,
                    'audio': (hasA ? af : vf).path,
                    'out': out.path,
                    'webm': false,
                  });
                } else if (o.muxed != null) {
                  final total = o.muxed!.size.totalBytes;
                  out = File('${tmp.path}/$id.$ext');
                  temps.add(out);
                  await _fetch(o.muxed!, out, id, (n) => tick(n, total));
                } else {
                  final total = o.video!.size.totalBytes + o.audio!.size.totalBytes;
                  final vf = File('${tmp.path}/${id}_v');
                  final af = File('${tmp.path}/${id}_a');
                  out = File('${tmp.path}/${id}_out.$ext');
                  temps.addAll([vf, af, out]);
                  await _fetch(o.video!, vf, id, (n) => tick(n, total));
                  await _fetch(o.audio!, af, id, (n) => tick(n, total));
                  if (mounted) {
                    setState(() {
                      _progress[id] = 0;
                      _active[id]?['merging'] = true;
                    });
                  }
                  if (_cancelled.contains(id)) throw 'cancelled';
                  _notify(id, title, 'Merge aaguthu...', -1, true);
                  await _call('mux', {
                    'video': vf.path,
                    'audio': af.path,
                    'out': out.path,
                    'webm': o.webm,
                  });
                }
                if (_cancelled.contains(id)) throw 'cancelled';
                final uri = await _call<String>('save', {
                  'path': out.path,
                  'name': '${_safe(title, id)} [$q].$ext',
                  'mime': mime,
                });
                _done[id] = {
                  'uri': uri ?? '',
                  'mime': mime,
                  'title': title,
                  'q': q,
                };
                await _saveDone();
                _notify(id, title, 'Download mudinjadhu ✓', 100, false);
                _msg('Download mudinjadhu: Download > ABH YouTube folder');
              } catch (e) {
                if (_cancelled.contains(id)) {
                  _msg('Download cancel aachu');
                  try {
                    await _call('cancelNotif', {'id': _nid(id)});
                  } catch (_) {}
                } else {
                  var why = e.toString();
                  if (why.length > 70) why = why.substring(0, 70);
                  _msg('Download fail: $why');
                  _notify(id, title, 'Download fail aachu', 100, false);
                }
              }
              for (final f in temps) {
                try {
                  if (await f.exists()) await f.delete();
                } catch (_) {}
              }
              if (mounted) {
                setState(() {
                  _progress.remove(id);
                  _active.remove(id);
                });
              }
              _cancelled.remove(id);
              if (--_activeCount == 0) _svc(false);
            }

