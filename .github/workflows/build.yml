name: Build ABH YouTube APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: flutter create --platforms=android --project-name youtube_app .
      - name: Write app code
        run: |
          cat > pubspec.yaml <<'EOF'
          name: youtube_app
          description: ABH YouTube
          publish_to: none
          version: 1.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            youtube_player_iframe: ^5.2.1
            youtube_explode_dart: ^2.3.0
            path_provider: ^2.1.0
          flutter:
            uses-material-design: true
          EOF
          cat > lib/main.dart <<'EOF'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:youtube_player_iframe/youtube_player_iframe.dart';
          import 'package:youtube_explode_dart/youtube_explode_dart.dart' as yte;

          // Home screen la ethu kaattanum nu inga maathalaam
          const homeQuery = 'trending videos today';
          const fallbackId = 'dQw4w9WgXcQ';
          const appName = 'ABH YouTube';
          const _ch = MethodChannel('abh/media');

          final darkMode = ValueNotifier<bool>(false);

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) => ValueListenableBuilder<bool>(
                  valueListenable: darkMode,
                  builder: (_, dark, __) => MaterialApp(
                    title: appName,
                    themeMode: dark ? ThemeMode.dark : ThemeMode.light,
                    theme: ThemeData(colorSchemeSeed: Colors.red, useMaterial3: true),
                    darkTheme: ThemeData(
                        colorSchemeSeed: Colors.red,
                        brightness: Brightness.dark,
                        useMaterial3: true),
                    home: const PlayerPage(),
                  ),
                );
          }

          class _Opt {
            final int h;
            final String label;
            final double mb;
            final yte.MuxedStreamInfo? muxed;
            final yte.VideoOnlyStreamInfo? video;
            final yte.AudioOnlyStreamInfo? audio;
            final bool webm;
            _Opt(this.h, this.label, this.mb,
                {this.muxed, this.video, this.audio, this.webm = false});
          }

          class PlayerPage extends StatefulWidget {
            const PlayerPage({super.key});
            @override
            State<PlayerPage> createState() => _PlayerPageState();
          }

          class _PlayerPageState extends State<PlayerPage> {
            final _text = TextEditingController();
            final _yt = yte.YoutubeExplode();
            List<yte.Video> _results = [];
            bool _loading = false;
            String _label = 'Trending';
            String _curId = '';
            String _curTitle = 'Trending video load aaguthu...';
            final Map<String, double> _progress = {};
            final Map<String, Map<String, dynamic>> _done = {};
            bool _barVisible = true;
            int _playSecs = 0;
            Timer? _timer;
            int _tab = 0;
            String _homeQ = homeQuery;
            String _name = '';
            final _homeCtl = TextEditingController();
            final _nameCtl = TextEditingController();
            final Map<String, Map<String, dynamic>> _active = {};
            final Set<String> _cancelled = {};
            int _activeCount = 0;
            int _filesTab = 0;

            late final YoutubePlayerController _controller =
                YoutubePlayerController.fromVideoId(
              videoId: fallbackId,
              autoPlay: false,
              params: const YoutubePlayerParams(
                showFullscreenButton: true,
                origin: 'https://www.youtube-nocookie.com',
              ),
            );

            @override
            void initState() {
              super.initState();
              _init();
              _timer = Timer.periodic(const Duration(seconds: 1), (_) {
                if (!mounted) return;
                final playing = _controller.value.playerState == PlayerState.playing;
                if (playing) {
                  _playSecs++;
                  if (_playSecs >= 5 && _barVisible) setState(() => _barVisible = false);
                } else {
                  _playSecs = 0;
                  if (!_barVisible) setState(() => _barVisible = true);
                }
              });
            }

            Future<void> _init() async {
              await _loadSettings();
              await _loadDone();
              await _runSearch(_homeQ, quiet: true, cueFirst: true);
            }

            Future<File> _settingsFile() async {
              final dir = await getApplicationDocumentsDirectory();
              return File('${dir.path}/settings.json');
            }

            Future<void> _loadSettings() async {
              try {
                final f = await _settingsFile();
                if (await f.exists()) {
                  final m = jsonDecode(await f.readAsString()) as Map;
                  darkMode.value = m['dark'] == true;
                  final h = m['home'];
                  if (h is String && h.trim().isNotEmpty) _homeQ = h.trim();
                  final n = m['name'];
                  if (n is String) _name = n;
                }
              } catch (_) {}
              _homeCtl.text = _homeQ;
              _nameCtl.text = _name;
            }

            Future<void> _saveSettings() async {
              try {
                final f = await _settingsFile();
                await f.writeAsString(jsonEncode(
                    {'dark': darkMode.value, 'home': _homeQ, 'name': _name}));
              } catch (_) {}
            }

            Future<File> _doneFile() async {
              final dir = await getApplicationDocumentsDirectory();
              return File('${dir.path}/downloaded2.json');
            }

            Future<void> _loadDone() async {
              try {
                final f = await _doneFile();
                if (await f.exists()) {
                  final m = jsonDecode(await f.readAsString()) as Map;
                  if (mounted) {
                    setState(() => m.forEach(
                        (k, v) => _done[k.toString()] = Map<String, dynamic>.from(v)));
                  }
                }
              } catch (_) {}
            }

            Future<void> _saveDone() async {
              try {
                final f = await _doneFile();
                await f.writeAsString(jsonEncode(_done));
              } catch (_) {}
            }

            void _msg(String m) {
              if (!mounted) return;
              ScaffoldMessenger.of(context)
                ..hideCurrentSnackBar()
                ..showSnackBar(SnackBar(content: Text(m)));
            }

            Future<void> _runSearch(String q,
                {bool quiet = false, bool cueFirst = false}) async {
              setState(() => _loading = true);
              try {
                final r = await _yt.search.search(q);
                if (!mounted) return;
                setState(() => _results = r.toList());
                if (_results.isEmpty && !quiet) _msg('Onnum kedaikkala');
                if (cueFirst && _results.isNotEmpty) {
                  final first = _results.first;
                  _controller.cueVideoById(videoId: first.id.value);
                  setState(() {
                    _curId = first.id.value;
                    _curTitle = first.title;
                  });
                }
              } catch (e) {
                if (!quiet) _msg('Search fail: internet check pannunga');
                if (cueFirst && mounted) {
                  setState(() {
                    _curId = fallbackId;
                    _curTitle = 'Rick Astley - Never Gonna Give You Up';
                  });
                }
              }
              if (mounted) setState(() => _loading = false);
            }

            void _play(String id, String title) {
              _controller.loadVideoById(videoId: id);
              setState(() {
                _curId = id;
                _curTitle = title;
              });
            }

            Future<void> _submit() async {
              final q = _text.text.trim();
              if (q.isEmpty) return;
              FocusScope.of(context).unfocus();
              if (q.startsWith('http')) {
                final id = YoutubePlayerController.convertUrlToId(q);
                if (id == null) {
                  _msg('Link thappu');
                  return;
                }
                _play(id, 'Video');
                try {
                  final v = await _yt.videos.get(id);
                  if (mounted && _curId == id) setState(() => _curTitle = v.title);
                } catch (_) {}
                return;
              }
              setState(() => _label = 'Results: $q');
              await _runSearch(q);
            }

            String _lbl(int h, num fps) {
              var s = fps > 30 ? '${h}p${fps.round()}' : '${h}p';
              if (h >= 2160) {
                s += '  (4K)';
              } else if (h >= 1440) {
                s += '  (2K)';
              } else if (h >= 1080) {
                s += '  (HD)';
              }
              return s;
            }

            List<_Opt> _buildOpts(yte.StreamManifest m) {
              final opts = <_Opt>[];
              final muxedH = <int>{};
              for (final s in m.muxed) {
                final c = s.container.name;
                if (c != 'mp4' && c != 'webm') continue;
                final h = s.videoResolution.height;
                muxedH.add(h);
                opts.add(_Opt(h, _lbl(h, s.framerate.framesPerSecond),
                    s.size.totalMegaBytes,
                    muxed: s, webm: c == 'webm'));
              }
              double score(yte.VideoOnlyStreamInfo v) =>
                  (v.videoCodec.toLowerCase().startsWith('avc') ? 1e12 : 0) +
                  v.bitrate.bitsPerSecond.toDouble();
              final best = <int, yte.VideoOnlyStreamInfo>{};
              for (final v in m.videoOnly) {
                final h = v.videoResolution.height;
                if (muxedH.contains(h)) continue;
                final c = v.container.name;
                final codec = v.videoCodec.toLowerCase();
                final ok = (c == 'mp4' && codec.startsWith('avc')) ||
                    (c == 'webm' && !codec.startsWith('av01'));
                if (!ok) continue;
                final cur = best[h];
                if (cur == null || score(v) > score(cur)) best[h] = v;
              }
              for (final e in best.entries) {
                final v = e.value;
                final webm = v.container.name == 'webm';
                final auds = m.audioOnly
                    .where((a) => a.container.name == (webm ? 'webm' : 'mp4'))
                    .toList()
                  ..sort((a, b) =>
                      b.bitrate.bitsPerSecond.compareTo(a.bitrate.bitsPerSecond));
                if (auds.isEmpty) continue;
                opts.add(_Opt(
                    e.key,
                    _lbl(e.key, v.framerate.framesPerSecond),
                    v.size.totalMegaBytes + auds.first.size.totalMegaBytes,
                    video: v,
                    audio: auds.first,
                    webm: webm));
              }
              opts.sort((a, b) => b.h.compareTo(a.h));
              return opts;
            }

            Future<void> _onDownloadTap(String id, String title) async {
              if (id.isEmpty) return;
              if (_done.containsKey(id)) {
                _msg('Already download aagiduchu ✓');
                return;
              }
              if (_progress.containsKey(id)) return;
              setState(() => _progress[id] = 0);
              List<_Opt> opts;
              try {
                final manifest = await _yt.videos.streamsClient.getManifest(id);
                opts = _buildOpts(manifest);
              } catch (e) {
                _msg('Quality edukka mudiyala. Thirumba try pannunga');
                if (mounted) setState(() => _progress.remove(id));
                return;
              }
              if (mounted) setState(() => _progress.remove(id));
              if (opts.isEmpty || !mounted) {
                _msg('Indha video download panna mudiyaadhu');
                return;
              }
              final chosen = await showModalBottomSheet<_Opt>(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => SafeArea(
                  child: Column(mainAxisSize: MainAxisSize.min, children: [
                    const Padding(
                      padding: EdgeInsets.all(16),
                      child: Text('Quality select pannunga',
                          style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                    ),
                    Flexible(
                      child: ListView(shrinkWrap: true, children: [
                        for (final o in opts)
                          ListTile(
                            leading: const Icon(Icons.high_quality),
                            title: Text(o.label),
                            subtitle: Text(
                                '${o.mb.toStringAsFixed(1)} MB  •  ${o.webm ? 'webm' : 'mp4'}'),
                            onTap: () => Navigator.pop(ctx, o),
                          ),
                      ]),
                    ),
                  ]),
                ),
              );
              if (chosen == null) return;
              await _download(id, title, chosen);
            }

            String _safe(String t, String id) {
              var s = t.replaceAll(RegExp(r'[\\/:*?"<>|\n\r]'), '').trim();
              if (s.isEmpty) s = id;
              if (s.length > 80) s = s.substring(0, 80);
              return s;
            }

            int _nid(String id) => (id.hashCode & 0x0fffffff) + 1000;

            Future<void> _notify(
                String id, String title, String text, int progress, bool ongoing) async {
              try {
                await _ch.invokeMethod('notify', {
                  'id': _nid(id),
                  'title': title,
                  'text': text,
                  'progress': progress,
                  'ongoing': ongoing,
                });
              } catch (_) {}
            }

            Future<void> _svc(bool on) async {
              try {
                await _ch.invokeMethod('svc', {'on': on});
              } catch (_) {}
            }

            // Veegama download: 6 connection sernthu (parallel). Fail aanaa pazhaya mura
            Future<void> _fetchFast(
                yte.StreamInfo s, File f, String id, void Function(int) onBytes) async {
              final total = s.size.totalBytes;
              const chunk = 2 * 1024 * 1024;
              final n = (total + chunk - 1) ~/ chunk;
              final client = HttpClient()
                ..connectionTimeout = const Duration(seconds: 15);
              final raf = await f.open(mode: FileMode.write);
              var next = 0;
              var failed = false;
              Future<void> lock = Future.value();
              Future<void> writeAt(int pos, List<int> data) {
                final p = lock.then((_) async {
                  await raf.setPosition(pos);
                  await raf.writeFrom(data);
                });
                lock = p.catchError((_) {});
                return p;
              }

              Future<void> worker() async {
                try {
                  while (!failed) {
                    if (_cancelled.contains(id)) throw 'cancelled';
                    final i = next++;
                    if (i >= n) return;
                    final start = i * chunk;
                    final end =
                        (start + chunk - 1 < total) ? start + chunk - 1 : total - 1;
                    final req = await client.getUrl(s.url);
                    req.headers.set(HttpHeaders.rangeHeader, 'bytes=$start-$end');
                    final res = await req.close();
                    if (res.statusCode != 206) {
                      await res.drain();
                      throw 'http ${res.statusCode}';
                    }
                    final bb = BytesBuilder(copy: false);
                    await for (final d in res) {
                      bb.add(d);
                      onBytes(d.length);
                    }
                    final data = bb.takeBytes();
                    if (data.length != end - start + 1) throw 'short';
                    await writeAt(start, data);
                  }
                } catch (e) {
                  failed = true;
                  rethrow;
                }
              }

              try {
                await Future.wait(List.generate(6, (_) => worker()));
              } finally {
                await lock;
                await raf.close();
                client.close(force: true);
              }
            }

            Future<void> _fetch(yte.StreamInfo s, File f, String id,
                void Function(int) onBytes) async {
              var counted = 0;
              void cnt(int n) {
                counted += n;
                onBytes(n);
              }

              try {
                await _fetchFast(s, f, id, cnt);
                return;
              } catch (e) {
                if (_cancelled.contains(id)) rethrow;
                onBytes(-counted);
                counted = 0;
              }
              final sink = f.openWrite();
              try {
                await for (final chunk in _yt.videos.streamsClient.get(s)) {
                  if (_cancelled.contains(id)) throw 'cancelled';
                  sink.add(chunk);
                  onBytes(chunk.length);
                }
                await sink.flush();
              } finally {
                await sink.close();
              }
            }

            Future<void> _download(String id, String title, _Opt o) async {
              final q = o.label.split(' ').first;
              setState(() {
                _progress[id] = 0;
                _active[id] = {'title': title, 'q': q, 'merging': false};
                _cancelled.remove(id);
              });
              if (_activeCount++ == 0) _svc(true);
              try {
                await _ch.invokeMethod('askNotif');
              } catch (_) {}
              final tmp = await getTemporaryDirectory();
              final temps = <File>[];
              try {
                _msg('Download aaguthu... My Files la paarunga');
                final ext = o.webm ? 'webm' : 'mp4';
                final mime = o.webm ? 'video/webm' : 'video/mp4';
                var got = 0;
                var lastPct = -1;
                var lastN = DateTime.fromMillisecondsSinceEpoch(0);
                void tick(int n, int total) {
                  got += n;
                  final raw = got * 100 ~/ total;
                  final pct = raw < 0 ? 0 : (raw > 100 ? 100 : raw);
                  if (pct != lastPct && mounted) {
                    lastPct = pct;
                    setState(() => _progress[id] = got / total);
                  }
                  final now = DateTime.now();
                  if (now.difference(lastN).inMilliseconds > 800) {
                    lastN = now;
                    _notify(id, title, '$q  •  $pct%', pct, true);
                  }
                }

                late File out;
                if (o.muxed != null) {
                  final total = o.muxed!.size.totalBytes;
                  out = File('${tmp.path}/$id.$ext');
                  temps.add(out);
                  await _fetch(o.muxed!, out, id, (n) => tick(n, total));
                } else {
                  final total = o.video!.size.totalBytes + o.audio!.size.totalBytes;
                  final vf = File('${tmp.path}/${id}_v');
                  final af = File('${tmp.path}/${id}_a');
                  out = File('${tmp.path}/${id}_out.$ext');
                  temps.addAll([vf, af, out]);
                  await _fetch(o.video!, vf, id, (n) => tick(n, total));
                  await _fetch(o.audio!, af, id, (n) => tick(n, total));
                  if (mounted) {
                    setState(() {
                      _progress[id] = 0;
                      _active[id]?['merging'] = true;
                    });
                  }
                  _notify(id, title, 'Merge aaguthu...', -1, true);
                  await _ch.invokeMethod('mux', {
                    'video': vf.path,
                    'audio': af.path,
                    'out': out.path,
                    'webm': o.webm,
                  });
                }
                final uri = await _ch.invokeMethod<String>('save', {
                  'path': out.path,
                  'name': '${_safe(title, id)} [$q].$ext',
                  'mime': mime,
                });
                _done[id] = {
                  'uri': uri ?? '',
                  'mime': mime,
                  'title': title,
                  'q': q,
                };
                await _saveDone();
                _notify(id, title, 'Download mudinjadhu ✓', 100, false);
                _msg('Download mudinjadhu: Download > ABH YouTube folder');
              } catch (e) {
                if (_cancelled.contains(id)) {
                  _msg('Download cancel aachu');
                  try {
                    await _ch.invokeMethod('cancelNotif', {'id': _nid(id)});
                  } catch (_) {}
                } else {
                  _msg('Download fail aachu');
                  _notify(id, title, 'Download fail aachu', 100, false);
                }
              }
              for (final f in temps) {
                try {
                  if (await f.exists()) await f.delete();
                } catch (_) {}
              }
              if (mounted) {
                setState(() {
                  _progress.remove(id);
                  _active.remove(id);
                });
              }
              _cancelled.remove(id);
              if (--_activeCount == 0) _svc(false);
            }

            Future<void> _openDone(String id) async {
              final d = _done[id];
              if (d == null || (d['uri'] as String).isEmpty) {
                _msg('Download > ABH YouTube folder la paarunga');
                return;
              }
              try {
                await _ch.invokeMethod('open', {'uri': d['uri'], 'mime': d['mime']});
              } catch (e) {
                _msg('Video open panna mudiyala (file delete aagirukkalaam)');
              }
            }

            Widget _dlButton(String id, String title) {
              final p = _progress[id];
              if (p != null) {
                return SizedBox(
                  width: 48,
                  height: 48,
                  child: Padding(
                    padding: const EdgeInsets.all(12),
                    child: CircularProgressIndicator(
                        value: p > 0 ? p : null, strokeWidth: 3),
                  ),
                );
              }
              if (_done.containsKey(id)) {
                return Row(mainAxisSize: MainAxisSize.min, children: [
                  IconButton(
                    tooltip: 'Paarkka',
                    icon: const Icon(Icons.visibility),
                    onPressed: () => _openDone(id),
                  ),
                  IconButton(
                    tooltip: 'Downloaded',
                    icon: const Icon(Icons.check_circle, color: Colors.green),
                    onPressed: () => _onDownloadTap(id, title),
                  ),
                ]);
              }
              return IconButton(
                tooltip: 'Download',
                icon: const Icon(Icons.download),
                onPressed: id.isEmpty ? null : () => _onDownloadTap(id, title),
              );
            }

            @override
            void dispose() {
              _timer?.cancel();
              _controller.close();
              _yt.close();
              _text.dispose();
              _homeCtl.dispose();
              _nameCtl.dispose();
              super.dispose();
            }

            Widget _home() => Column(children: [
                    AnimatedOpacity(
                      opacity: _barVisible ? 1 : 0,
                      duration: const Duration(milliseconds: 400),
                      child: IgnorePointer(
                        ignoring: !_barVisible,
                        child: Padding(
                          padding: const EdgeInsets.only(left: 12),
                          child: Row(children: [
                            Expanded(
                              child: Text(_curTitle,
                                  maxLines: 1, overflow: TextOverflow.ellipsis),
                            ),
                            _dlButton(_curId, _curTitle),
                          ]),
                        ),
                      ),
                    ),
                    YoutubePlayer(controller: _controller, aspectRatio: 16 / 9),
                    Padding(
                      padding: const EdgeInsets.fromLTRB(12, 8, 12, 8),
                      child: Row(children: [
                        Expanded(
                          child: TextField(
                            controller: _text,
                            textInputAction: TextInputAction.search,
                            onSubmitted: (_) => _submit(),
                            decoration: const InputDecoration(
                              hintText: 'Search or paste link',
                              border: OutlineInputBorder(),
                            ),
                          ),
                        ),
                        const SizedBox(width: 8),
                        IconButton.filled(
                          onPressed: _submit,
                          icon: const Icon(Icons.search),
                        ),
                      ]),
                    ),
                    if (_loading) const LinearProgressIndicator(),
                    Align(
                      alignment: Alignment.centerLeft,
                      child: Padding(
                        padding: const EdgeInsets.fromLTRB(12, 4, 12, 4),
                        child: Text(_label,
                            style: const TextStyle(fontWeight: FontWeight.bold)),
                      ),
                    ),
                    Expanded(
                      child: ListView.builder(
                        itemCount: _results.length,
                        itemBuilder: (context, i) {
                          final v = _results[i];
                          return ListTile(
                            leading: Image.network(
                              v.thumbnails.mediumResUrl,
                              width: 100,
                              fit: BoxFit.cover,
                              errorBuilder: (_, __, ___) =>
                                  const SizedBox(width: 100, child: Icon(Icons.movie)),
                            ),
                            title: Text(v.title,
                                maxLines: 2, overflow: TextOverflow.ellipsis),
                            subtitle: Text(v.author,
                                maxLines: 1, overflow: TextOverflow.ellipsis),
                            trailing: _dlButton(v.id.value, v.title),
                            onTap: () => _play(v.id.value, v.title),
                          );
                        },
                      ),
                    ),
            ]);

            Future<bool> _confirm(String title, String body) async {
              final r = await showDialog<bool>(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: Text(title),
                  content: Text(body),
                  actions: [
                    TextButton(
                        onPressed: () => Navigator.pop(ctx, false),
                        child: const Text('Venam')),
                    FilledButton(
                        onPressed: () => Navigator.pop(ctx, true),
                        child: const Text('Aamaa')),
                  ],
                ),
              );
              return r == true;
            }

            Future<void> _removeDone(String id) async {
              final ok = await _confirm('List la irundhu neekkanuma?',
                  'File Download > ABH YouTube folder la appadiye irukkum. List la irundhu mattum neekkum. Apram thirumba download pannalaam.');
              if (!ok) return;
              setState(() => _done.remove(id));
              await _saveDone();
            }

            Future<void> _clearDone() async {
              final ok = await _confirm('Download list clear pannanuma?',
                  'Files delete aagaadhu. List mattum clear aagum.');
              if (!ok) return;
              setState(() => _done.clear());
              await _saveDone();
            }

            Future<void> _applyHome() async {
              FocusScope.of(context).unfocus();
              final t = _homeCtl.text.trim();
              _homeQ = t.isEmpty ? homeQuery : t;
              _homeCtl.text = _homeQ;
              await _saveSettings();
              setState(() => _label = 'Trending');
              _msg('Save aachu');
              _runSearch(_homeQ, quiet: true);
            }

            Widget _files() => Column(children: [
                  Padding(
                    padding: const EdgeInsets.all(12),
                    child: SegmentedButton<int>(
                      segments: [
                        ButtonSegment(
                            value: 0,
                            icon: const Icon(Icons.downloading),
                            label: Text('Downloading (${_active.length})')),
                        ButtonSegment(
                            value: 1,
                            icon: const Icon(Icons.download_done),
                            label: Text('Downloaded (${_done.length})')),
                      ],
                      selected: {_filesTab},
                      onSelectionChanged: (v) => setState(() => _filesTab = v.first),
                    ),
                  ),
                  Expanded(
                      child: _filesTab == 0 ? _downloadingList() : _downloadedList()),
                ]);

            Widget _downloadingList() {
              final items = _active.entries.toList();
              if (items.isEmpty) {
                return const Center(child: Text('Ippo download edhuvum nadakkala'));
              }
              return ListView.builder(
                itemCount: items.length,
                itemBuilder: (context, i) {
                  final id = items[i].key;
                  final d = items[i].value;
                  final p = _progress[id] ?? 0.0;
                  final merging = d['merging'] == true;
                  return ListTile(
                    leading: Image.network(
                      'https://img.youtube.com/vi/$id/mqdefault.jpg',
                      width: 80,
                      fit: BoxFit.cover,
                      errorBuilder: (_, __, ___) =>
                          const SizedBox(width: 80, child: Icon(Icons.movie)),
                    ),
                    title: Text(d['title'] as String,
                        maxLines: 2, overflow: TextOverflow.ellipsis),
                    subtitle: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const SizedBox(height: 6),
                          LinearProgressIndicator(
                              value: (p > 0 && !merging) ? p : null),
                          const SizedBox(height: 4),
                          Text(merging
                              ? 'Merge aaguthu...'
                              : '${d['q']}  •  ${(p * 100).round()}%'),
                        ]),
                    trailing: IconButton(
                      tooltip: 'Cancel',
                      icon: const Icon(Icons.close),
                      onPressed: () {
                        _cancelled.add(id);
                        _msg('Cancel panren...');
                      },
                    ),
                  );
                },
              );
            }

            Widget _downloadedList() {
              final items = _done.entries.toList().reversed.toList();
              if (items.isEmpty) {
                return const Center(child: Text('Innum download onnum illa'));
              }
              return ListView.builder(
                itemCount: items.length,
                itemBuilder: (context, i) {
                  final id = items[i].key;
                  final d = items[i].value;
                  final title = (d['title'] as String?) ?? id;
                  final q = (d['q'] as String?) ?? '';
                  return ListTile(
                    leading: Image.network(
                      'https://img.youtube.com/vi/$id/mqdefault.jpg',
                      width: 80,
                      fit: BoxFit.cover,
                      errorBuilder: (_, __, ___) =>
                          const SizedBox(width: 80, child: Icon(Icons.movie)),
                    ),
                    title: Text(title, maxLines: 2, overflow: TextOverflow.ellipsis),
                    subtitle: Text(q.isEmpty ? 'ABH YouTube' : '$q  •  ABH YouTube'),
                    trailing: Row(mainAxisSize: MainAxisSize.min, children: [
                      IconButton(
                        tooltip: 'Paarkka',
                        icon: const Icon(Icons.visibility),
                        onPressed: () => _openDone(id),
                      ),
                      IconButton(
                        tooltip: 'List la irundhu neekku',
                        icon: const Icon(Icons.close),
                        onPressed: () => _removeDone(id),
                      ),
                    ]),
                  );
                },
              );
            }

            Widget _settings() => ListView(children: [
                  ValueListenableBuilder<bool>(
                    valueListenable: darkMode,
                    builder: (_, dark, __) => SwitchListTile(
                      secondary: const Icon(Icons.dark_mode),
                      title: const Text('Dark mode'),
                      value: dark,
                      onChanged: (v) {
                        darkMode.value = v;
                        _saveSettings();
                      },
                    ),
                  ),
                  Padding(
                    padding: const EdgeInsets.fromLTRB(16, 8, 16, 8),
                    child: Row(children: [
                      Expanded(
                        child: TextField(
                          controller: _homeCtl,
                          decoration: const InputDecoration(
                            labelText: 'Home la ethu kaattanum (search)',
                            border: OutlineInputBorder(),
                          ),
                        ),
                      ),
                      const SizedBox(width: 8),
                      FilledButton(onPressed: _applyHome, child: const Text('Save')),
                    ]),
                  ),
                  const ListTile(
                    leading: Icon(Icons.folder),
                    title: Text('Download folder'),
                    subtitle: Text('Download > ABH YouTube'),
                  ),
                  ListTile(
                    leading: const Icon(Icons.delete_sweep),
                    title: const Text('Download list clear pannu'),
                    subtitle: const Text('Files delete aagaadhu'),
                    onTap: _clearDone,
                  ),
                  const ListTile(
                    leading: Icon(Icons.info_outline),
                    title: Text(appName),
                    subtitle: Text('Version 1.0'),
                  ),
                ]);

            Widget _profile() {
              final n = _name.trim();
              final initial = n.isEmpty ? 'A' : String.fromCharCode(n.runes.first);
              return ListView(padding: const EdgeInsets.all(16), children: [
                const SizedBox(height: 16),
                Center(
                  child: CircleAvatar(
                    radius: 48,
                    child: Text(initial.toUpperCase(),
                        style: const TextStyle(fontSize: 36)),
                  ),
                ),
                const SizedBox(height: 8),
                Center(
                  child: Text(n.isEmpty ? 'Peyar set pannala' : n,
                      style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
                ),
                const SizedBox(height: 20),
                TextField(
                  controller: _nameCtl,
                  decoration: const InputDecoration(
                    labelText: 'Unga peyar',
                    border: OutlineInputBorder(),
                  ),
                ),
                const SizedBox(height: 12),
                FilledButton(
                  onPressed: () {
                    FocusScope.of(context).unfocus();
                    setState(() => _name = _nameCtl.text.trim());
                    _saveSettings();
                    _msg('Save aachu');
                  },
                  child: const Text('Save'),
                ),
                const SizedBox(height: 20),
                Card(
                  child: ListTile(
                    leading: const Icon(Icons.download_done),
                    title: const Text('Mothama download'),
                    trailing: Text('${_done.length}',
                        style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                  ),
                ),
              ]);
            }

            @override
            Widget build(BuildContext context) {
              const titles = [appName, 'My Files', 'Settings', 'Profile'];
              return Scaffold(
                appBar: AppBar(title: Text(titles[_tab])),
                body: IndexedStack(
                  index: _tab,
                  children: [_home(), _files(), _settings(), _profile()],
                ),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: _tab,
                  onDestinationSelected: (i) {
                    if (i != 0) _controller.pauseVideo();
                    setState(() => _tab = i);
                  },
                  destinations: const [
                    NavigationDestination(icon: Icon(Icons.home), label: 'Home'),
                    NavigationDestination(icon: Icon(Icons.folder), label: 'My Files'),
                    NavigationDestination(icon: Icon(Icons.settings), label: 'Settings'),
                    NavigationDestination(icon: Icon(Icons.person), label: 'Profile'),
                  ],
                ),
              );
            }
          }
          EOF
      - name: Write native code
        run: |
          F=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          D=$(dirname "$F")
          PKG=$(grep -m1 '^package' "$F")
          echo "$PKG" > "$F"
          cat >> "$F" <<'KOT'

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.ContentValues
          import android.content.pm.PackageManager
          import android.content.Intent
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.nio.ByteBuffer

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val main = Handler(Looper.getMainLooper())
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "abh/media")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "mux" -> Thread {
                                  try {
                                      mux(
                                          call.argument<String>("video")!!,
                                          call.argument<String>("audio")!!,
                                          call.argument<String>("out")!!,
                                          call.argument<Boolean>("webm") ?: false
                                      )
                                      main.post { result.success(true) }
                                  } catch (e: Exception) {
                                      main.post { result.error("mux", e.toString(), null) }
                                  }
                              }.start()
                              "save" -> Thread {
                                  try {
                                      val uri = save(
                                          call.argument<String>("path")!!,
                                          call.argument<String>("name")!!,
                                          call.argument<String>("mime")!!
                                      )
                                      main.post { result.success(uri) }
                                  } catch (e: Exception) {
                                      main.post { result.error("save", e.toString(), null) }
                                  }
                              }.start()
                              "open" -> try {
                                  val i = Intent(Intent.ACTION_VIEW)
                                  i.setDataAndType(
                                      Uri.parse(call.argument<String>("uri")),
                                      call.argument<String>("mime")
                                  )
                                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(i)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.error("open", e.toString(), null)
                              }
                              "notify" -> {
                                  notifyDl(
                                      call.argument<Int>("id")!!,
                                      call.argument<String>("title")!!,
                                      call.argument<String>("text")!!,
                                      call.argument<Int>("progress")!!,
                                      call.argument<Boolean>("ongoing")!!
                                  )
                                  result.success(true)
                              }
                              "cancelNotif" -> {
                                  nm().cancel(call.argument<Int>("id")!!)
                                  result.success(true)
                              }
                              "askNotif" -> {
                                  if (Build.VERSION.SDK_INT >= 33 &&
                                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                                  ) {
                                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 11)
                                  }
                                  result.success(true)
                              }
                              "svc" -> {
                                  val i = Intent(this, DlService::class.java)
                                  if (call.argument<Boolean>("on") == true) {
                                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
                                  } else {
                                      stopService(i)
                                  }
                                  result.success(true)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun nm() = getSystemService(NOTIFICATION_SERVICE) as NotificationManager

              private fun notifyDl(id: Int, title: String, text: String, progress: Int, ongoing: Boolean) {
                  val m = nm()
                  if (Build.VERSION.SDK_INT >= 26) {
                      m.createNotificationChannel(
                          NotificationChannel("dl", "Downloads", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, "dl")
                  else Notification.Builder(this)
                  b.setContentTitle(title)
                  b.setContentText(text)
                  b.setSmallIcon(
                      if (ongoing) android.R.drawable.stat_sys_download
                      else android.R.drawable.stat_sys_download_done
                  )
                  b.setOngoing(ongoing)
                  b.setOnlyAlertOnce(true)
                  b.setAutoCancel(!ongoing)
                  if (ongoing) b.setProgress(100, if (progress < 0) 0 else progress, progress < 0)
                  val pi = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  b.setContentIntent(pi)
                  m.notify(id, b.build())
              }

              private fun pick(path: String, prefix: String): Pair<MediaExtractor, Int> {
                  val ex = MediaExtractor()
                  ex.setDataSource(path)
                  for (i in 0 until ex.trackCount) {
                      val mime = ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME) ?: ""
                      if (mime.startsWith(prefix)) {
                          ex.selectTrack(i)
                          return Pair(ex, i)
                      }
                  }
                  throw Exception("no $prefix track")
              }

              private fun mux(video: String, audio: String, out: String, webm: Boolean) {
                  val (vEx, vi) = pick(video, "video/")
                  val (aEx, ai) = pick(audio, "audio/")
                  val fmt = if (webm) MediaMuxer.OutputFormat.MUXER_OUTPUT_WEBM
                  else MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4
                  val muxer = MediaMuxer(out, fmt)
                  val vt = muxer.addTrack(vEx.getTrackFormat(vi))
                  val at = muxer.addTrack(aEx.getTrackFormat(ai))
                  muxer.start()
                  val buf = ByteBuffer.allocate(8 * 1024 * 1024)
                  val info = MediaCodec.BufferInfo()
                  var vDone = false
                  var aDone = false
                  while (!(vDone && aDone)) {
                      val useV = !vDone && (aDone || vEx.sampleTime <= aEx.sampleTime)
                      val ex = if (useV) vEx else aEx
                      val tr = if (useV) vt else at
                      val size = ex.readSampleData(buf, 0)
                      if (size < 0) {
                          if (useV) vDone = true else aDone = true
                          continue
                      }
                      info.set(0, size, ex.sampleTime, ex.sampleFlags)
                      muxer.writeSampleData(tr, buf, info)
                      ex.advance()
                  }
                  muxer.stop()
                  muxer.release()
                  vEx.release()
                  aEx.release()
              }

              private fun save(path: String, name: String, mime: String): String {
                  val src = File(path)
                  val resultUri: String
                  if (Build.VERSION.SDK_INT >= 29) {
                      val v = ContentValues()
                      v.put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      v.put(MediaStore.MediaColumns.MIME_TYPE, mime)
                      v.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/ABH YouTube")
                      v.put(MediaStore.MediaColumns.IS_PENDING, 1)
                      val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v)
                          ?: throw Exception("insert failed")
                      contentResolver.openOutputStream(uri)!!.use { o ->
                          src.inputStream().use { it.copyTo(o, 1 shl 20) }
                      }
                      v.clear()
                      v.put(MediaStore.MediaColumns.IS_PENDING, 0)
                      contentResolver.update(uri, v, null, null)
                      resultUri = uri.toString()
                  } else {
                      val dir = File(
                          Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS),
                          "ABH YouTube"
                      )
                      dir.mkdirs()
                      val dst = File(dir, name)
                      src.copyTo(dst, true)
                      resultUri = Uri.fromFile(dst).toString()
                  }
                  src.delete()
                  return resultUri
              }
          }
          KOT
          echo "$PKG" > "$D/DlService.kt"
          cat >> "$D/DlService.kt" <<'SVC'

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder

          class DlService : Service() {
              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val m = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) {
                      m.createNotificationChannel(
                          NotificationChannel("svc", "Background", NotificationManager.IMPORTANCE_MIN)
                      )
                  }
                  val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, "svc")
                  else Notification.Builder(this)
                  b.setContentTitle("ABH YouTube")
                  b.setContentText("Download nadakkuthu")
                  b.setSmallIcon(android.R.drawable.stat_sys_download)
                  b.setOngoing(true)
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(777, b.build(), ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  } else {
                      startForeground(777, b.build())
                  }
                  return START_NOT_STICKY
              }
          }
          SVC
      - name: Manifest changes
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    <application#' $M
          sed -i 's#</application>#    <service android:name=".DlService" android:foregroundServiceType="dataSync" android:exported="false"/>\n    </application>#' $M
          sed -i 's#android:label="[^"]*"#android:label="ABH YouTube"#' $M
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: abh-youtube-apk
          path: build/app/outputs/flutter-apk/app-release.apk
