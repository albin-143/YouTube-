name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: flutter create --platforms=android --project-name youtube_app .
      - name: Write app code
        run: |
          cat > pubspec.yaml <<'EOF'
          name: youtube_app
          description: YouTube search and player
          publish_to: none
          version: 1.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            youtube_player_iframe: ^5.2.1
            youtube_explode_dart: ^2.3.0
          flutter:
            uses-material-design: true
          EOF
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:youtube_player_iframe/youtube_player_iframe.dart';
          import 'package:youtube_explode_dart/youtube_explode_dart.dart' as yte;

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
                  title: 'YouTube Player',
                  theme: ThemeData(colorSchemeSeed: Colors.red, useMaterial3: true),
                  home: const PlayerPage(),
                );
          }

          class PlayerPage extends StatefulWidget {
            const PlayerPage({super.key});
            @override
            State<PlayerPage> createState() => _PlayerPageState();
          }

          class _PlayerPageState extends State<PlayerPage> {
            final _text = TextEditingController();
            final _yt = yte.YoutubeExplode();
            List<yte.Video> _results = [];
            bool _loading = false;

            late final YoutubePlayerController _controller =
                YoutubePlayerController.fromVideoId(
              videoId: 'dQw4w9WgXcQ',
              autoPlay: false,
              params: const YoutubePlayerParams(
                showFullscreenButton: true,
                origin: 'https://www.youtube-nocookie.com',
              ),
            );

            void _msg(String m) => ScaffoldMessenger.of(context)
                .showSnackBar(SnackBar(content: Text(m)));

            Future<void> _search() async {
              final q = _text.text.trim();
              if (q.isEmpty) return;
              FocusScope.of(context).unfocus();

              if (q.startsWith('http')) {
                final id = YoutubePlayerController.convertUrlToId(q);
                if (id == null) {
                  _msg('Link thappu');
                } else {
                  _controller.loadVideoById(videoId: id);
                }
                return;
              }

              setState(() => _loading = true);
              try {
                final r = await _yt.search.search(q);
                setState(() => _results = r.toList());
                if (_results.isEmpty) _msg('Onnum kedaikkala');
              } catch (e) {
                _msg('Search fail: internet check pannunga');
              }
              setState(() => _loading = false);
            }

            @override
            void dispose() {
              _controller.close();
              _yt.close();
              _text.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) => Scaffold(
                  appBar: AppBar(title: const Text('YouTube Player')),
                  body: Column(children: [
                    YoutubePlayer(controller: _controller, aspectRatio: 16 / 9),
                    Padding(
                      padding: const EdgeInsets.all(12),
                      child: Row(children: [
                        Expanded(
                          child: TextField(
                            controller: _text,
                            textInputAction: TextInputAction.search,
                            onSubmitted: (_) => _search(),
                            decoration: const InputDecoration(
                              hintText: 'Search or paste link',
                              border: OutlineInputBorder(),
                            ),
                          ),
                        ),
                        const SizedBox(width: 8),
                        IconButton.filled(
                          onPressed: _search,
                          icon: const Icon(Icons.search),
                        ),
                      ]),
                    ),
                    if (_loading) const LinearProgressIndicator(),
                    Expanded(
                      child: ListView.builder(
                        itemCount: _results.length,
                        itemBuilder: (context, i) {
                          final v = _results[i];
                          return ListTile(
                            leading: Image.network(
                              v.thumbnails.mediumResUrl,
                              width: 100,
                              fit: BoxFit.cover,
                              errorBuilder: (_, __, ___) =>
                                  const SizedBox(width: 100, child: Icon(Icons.movie)),
                            ),
                            title: Text(v.title, maxLines: 2, overflow: TextOverflow.ellipsis),
                            subtitle: Text(v.author, maxLines: 1, overflow: TextOverflow.ellipsis),
                            onTap: () => _controller.loadVideoById(videoId: v.id.value),
                          );
                        },
                      ),
                    ),
                  ]),
                );
          }
          EOF
      - name: Add internet permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-apk
          path: build/app/outputs/flutter-apk/app-release.apk
