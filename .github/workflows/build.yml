            Future<void> _applyHome() async {
              FocusScope.of(context).unfocus();
              final t = _homeCtl.text.trim();
              _homeQ = t.isEmpty ? homeQuery : t;
              _homeCtl.text = _homeQ;
              await _saveSettings();
              setState(() => _label = 'Trending');
              _msg('Save aachu');
              _runSearch(_homeQ, quiet: true);
